<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatlılar — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Tatlılar</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/suffle.jpg" alt="Suffle">
                </div>
                <div class="content">
                    <h4>Suffle</h4>
                    <span>250 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/sutlac.webp" alt="Sütlaç">
                </div>
                <div class="content">
                    <h4>Sütlaç</h4>
                    <span>250 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/waffle.avif" alt="Waffle">
                </div>
                <div class="content">
                    <h4>Waffle (Tükendi)</h4>
                    <span>300 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/kunefe.webp" alt="Künefe">
                </div>
                <div class="content">
                    <h4>Künefe (Tükendi)</h4>
                    <span>250 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/lazboregi.jpg" alt="Laz Böreği">
                </div>
                <div class="content">
                    <h4>Laz Böreği (Tükendi)</h4>
                    <span>250 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
