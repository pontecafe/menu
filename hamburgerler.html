<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburgerler — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
  <link rel="stylesheet" href="css/lang.css" />
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
      <a href="hamburgerler-ar.html" class="lang-switch" lang="ar">عربي</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Hamburgerler</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavukburger.png" alt="Tavuk Burger">
                </div>
                <div class="content">
                    <h4>Tavuk Burger</h4>
                    <span>400 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/danaburger.webp" alt="Dana Burger">
                </div>
                <div class="content">
                    <h4>Dana Burger</h4>
                    <span>500 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/danaburger.png" alt="Ponte Burger">
                </div>
                <div class="content">
                    <h4>Ponte Burger</h4>
                    <span>650 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
