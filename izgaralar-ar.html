<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشويات — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
  <link rel="stylesheet" href="css/lang.css" />
</head>
<body>
    <header class="header">
        <a href="cafe-ar.html" class="logo">Ponte Cafe</a>
      <a href="izgaralar.html" class="lang-switch" lang="tr">Türkçe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">المشويات</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/kofteizgara.webp" alt="كفتة مشوية">
                </div>
                <div class="content">
                    <div class="text-block">
                        <h4>كفتة مشوية</h4>
                        <p>4 قطع كفتة، أرز، بطاطس، خضار ورقية، فلفل مشوي، طماطم مشوية</p>
                    </div>
                    <span>600 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavukizgara.jpeg" alt="دجاج مشوي">
                </div>
                <div class="content">
                    <div class="text-block">
                        <h4>دجاج مشوي</h4>
                        <p>150 غ دجاج، أرز، بطاطس، خضار ورقية، طماطم مشوية</p>
                    </div>
                    <span>500 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavukwrap.jpg" alt="رأب دجاج">
                </div>
                <div class="content">
                    <h4>رأب دجاج</h4>
                    <span>500 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/koftewrap.jpg" alt="رأب كفتة">
                </div>
                <div class="content">
                    <h4>رأب كفتة</h4>
                    <span>600 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/sinitzel.jpg" alt="شنيتزل">
                </div>
                <div class="content">
                    <h4>شنيتزل</h4>
                    <span>400 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/alabalik.jpg" alt="سمك الترويت المشوي">
                </div>
                <div class="content">
                    <h4>سمك الترويت المشوي</h4>
                    <span>700 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
