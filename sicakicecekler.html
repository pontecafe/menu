<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıcak İçecekler — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Sıcak İçecekler</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/hot2.jpg" alt="Çay">
                </div>
                <div class="content">
                    <h4>Çay</h4>
                    <span>25 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/fincancay.jpg" alt="Fincan Çay">
                </div>
                <div class="content">
                    <h4>Fincan Çay</h4>
                    <span>50 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/ihlamurcay.jpg" alt="Ihlamur Çay">
                </div>
                <div class="content">
                    <h4>Ihlamur Çay</h4>
                    <span>100 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/papatyacayi.webp" alt="Papatya Çayı">
                </div>
                <div class="content">
                    <h4>Papatya Çayı</h4>
                    <span>100 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/nanelimon.png.webp" alt="Nane Limon">
                </div>
                <div class="content">
                    <h4>Nane Limon</h4>
                    <span>100 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/kirazsapicayi.jpg" alt="Kiraz Sapı Çayı">
                </div>
                <div class="content">
                    <h4>Kiraz Sapı Çayı</h4>
                    <span>100 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
