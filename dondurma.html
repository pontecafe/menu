<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dondurma — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Dondurma</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/cikolatadondurma.avif" alt="Çikolata">
                </div>
                <div class="content">
                    <h4>Çikolata</h4>
                    <span>30 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/cilekdondurma.jpg" alt="Çilek">
                </div>
                <div class="content">
                    <h4>Çilek</h4>
                    <span>30 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/antepdondurma.jpeg" alt="Antep">
                </div>
                <div class="content">
                    <h4>Antep</h4>
                    <span>30 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/vanilyadondurma.jpg" alt="Vanilya">
                </div>
                <div class="content">
                    <h4>Vanilya</h4>
                    <span>30 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/karameldondurma.jpeg" alt="Karamel">
                </div>
                <div class="content">
                    <h4>Karamel</h4>
                    <span>30 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
