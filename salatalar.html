<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salatalar — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Salatalar</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/mevsimsalata.webp" alt="Mevsim Salata">
                </div>
                <div class="content">
                    <h4>Ton Balıklı Salata</h4>
                    <span>400 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/cobansalata.jpeg" alt="Çoban Salata">
                </div>
                <div class="content">
                    <h4>Çoban Salata</h4>
                    <span>300 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavuklusalata.webp" alt="Tavuklu Salata">
                </div>
                <div class="content">
                    <h4>Tavuklu Salata</h4>
                    <span>400TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
