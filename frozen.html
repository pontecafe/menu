<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frozen — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Frozen</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/karpuzfrozen.jpg" alt="Karpuz Frozen">
                </div>
                <div class="content">
                    <h4>Karpuz Frozen (Tükendi)</h4>
                    <span>170 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/kavunfrozen.jpg" alt="Kavun Frozen">
                </div>
                <div class="content">
                    <h4>Kavun Frozen (Tükendi)</h4>
                    <span>170 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/cilekfrozen.jpg" alt="Çilek Frozen">
                </div>
                <div class="content">
                    <h4>Çilek Frozen (Tükendi)</h4>
                    <span>170 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/mangofrozen.jpeg" alt="Mango Frozen">
                </div>
                <div class="content">
                    <h4>Mango Frozen (Tükendi)</h4>
                    <span>170 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/bogurtlenfrozen.jpg" alt="Böğürtlen Frozen">
                </div>
                <div class="content">
                    <h4>Böğürtlen Frozen (Tükendi)</h4>
                    <span>170 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/frozen.webp" alt="Freshşuka Frozen">
                </div>
                <div class="content">
                    <h4>Freshşuka Frozen (Tükendi)</h4>
                    <span>170 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
