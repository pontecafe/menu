<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البرغر — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
  <link rel="stylesheet" href="css/lang.css" />
</head>
<body>
    <header class="header">
        <a href="cafe-ar.html" class="logo">Ponte Cafe</a>
      <a href="hamburgerler.html" class="lang-switch" lang="tr">Türkçe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">البرغر</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavukburger.png" alt="برغر دجاج">
                </div>
                <div class="content">
                    <h4>برغر دجاج</h4>
                    <span>400 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/danaburger.webp" alt="برغر لحم بقري">
                </div>
                <div class="content">
                    <h4>برغر لحم بقري</h4>
                    <span>500 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/danaburger.png" alt="برغر بونتي">
                </div>
                <div class="content">
                    <h4>برغر بونتي</h4>
                    <span>650 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
