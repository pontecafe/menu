<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soğuk Kahveler — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Soğuk Kahveler</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/icelittesoguk.jpg" alt="Ice Latte">
                </div>
                <div class="content">
                    <h4>Ice Latte</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/icemoka.jpg" alt="Ice Moka">
                </div>
                <div class="content">
                    <h4>Ice Moka</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/icemoka.png" alt="Ice White Moka">
                </div>
                <div class="content">
                    <h4>Ice White Moka</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/ice-americano.jpg" alt="Ice Americano">
                </div>
                <div class="content">
                    <h4>Ice Americano</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/icekaramelmakiyato.jpg" alt="Ice Karamel Makiayato">
                </div>
                <div class="content">
                    <h4>Ice Karamel Makiayato</h4>
                    <span>200 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
