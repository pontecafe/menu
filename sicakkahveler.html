<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıcak Kahveler — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Sıcak Kahveler</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/latte.webp" alt="Latte">
                </div>
                <div class="content">
                    <h4>Latte</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/moka.webp" alt="Moka">
                </div>
                <div class="content">
                    <h4>Moka</h4>
                    <span>250 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/whitemoka.jpeg" alt="White Moka">
                </div>
                <div class="content">
                    <h4>White Moka</h4>
                    <span>250 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/cappuccino.jpeg" alt="Cappuccino">
                </div>
                <div class="content">
                    <h4>Cappuccino</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/Americano.jxl" alt="Americano">
                </div>
                <div class="content">
                    <h4>Americano</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/karamelmakiyato.webp" alt="Karamel Makiayato">
                </div>
                <div class="content">
                    <h4>Karamel Makiayato</h4>
                    <span>250 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/Expresso.jpg" alt="Expresso">
                </div>
                <div class="content">
                    <h4>Expresso</h4>
                    <span>150 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/Expresso.jpg" alt="Double Expresso">
                </div>
                <div class="content">
                    <h4>Double Expresso</h4>
                    <span>200 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/turkkahvesi.jxl" alt="Türk Kahvesi">
                </div>
                <div class="content">
                    <h4>Türk Kahvesi</h4>
                    <span>150 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/turkkahvesi.jxl" alt="Damla Sakızlı Türk Kahvesi">
                </div>
                <div class="content">
                    <h4>Damla Sakızlı Türk Kahvesi</h4>
                    <span>150 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/menengickahvesi.jpg" alt="Menengiç">
                </div>
                <div class="content">
                    <h4>Menengiç</h4>
                    <span>150 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
