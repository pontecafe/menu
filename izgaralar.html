<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izgaralar — Ponte Cafe</title>
    <link rel="stylesheet" href="css/icerik.css">
</head>
<body>
    <header class="header">
        <a href="cafe.html" class="logo">Ponte Cafe</a>
    </header>

    <section class="card" id="card">
        <h2 class="heading">Izgaralar</h2>
        <div class="card-container">

            <div class="card-box">
                <div class="image-container">
                    <img src="images/kofteizgara.webp" alt="Köfte Izgara">
                </div>
                <div class="content">
                    <div class="text-block">
                        <h4>Köfte Izgara</h4>
                        <p>4 adet köfte, Pilav, Patates, Yeşillik, Köz biber, Köz domates</p>
                    </div>
                    <span>600 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavukizgara.jpeg" alt="Tavuk Izgara">
                </div>
                <div class="content">
                    <div class="text-block">
                        <h4>Tavuk Izgara</h4>
                        <p>150 gr tavuk, Pilav, Patates, Yeşillik, Köz domates</p>
                    </div>
                    <span>500 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/tavukwrap.jpg" alt="Tavuk Wrap">
                </div>
                <div class="content">
                    <h4>Tavuk Wrap</h4>
                    <span>500 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/koftewrap.jpg" alt="Köfte Wrap">
                </div>
                <div class="content">
                    <h4>Köfte Wrap</h4>
                    <span>600 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/sinitzel.jpg" alt="Şinitzel">
                </div>
                <div class="content">
                    <h4>Şinitzel</h4>
                    <span>400 TL</span>
                </div>
            </div>

            <div class="card-box">
                <div class="image-container">
                    <img src="images/alabalik.jpg" alt="Alabalık Izgara">
                </div>
                <div class="content">
                    <h4>Alabalık Izgara</h4>
                    <span>700 TL</span>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
